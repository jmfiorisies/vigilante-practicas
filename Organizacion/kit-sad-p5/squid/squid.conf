# squid.conf · El proxy de la oficina de La Taquilla
# Después de cada cambio:  ./lab.sh squid   (comprueba que no hay errores y lo aplica)
#
# Squid lee las reglas http_access DE ARRIBA ABAJO y se queda con la PRIMERA que encaja.

# ---------------------------------------------------------------------------------------------------
# 👀 Lo básico: el puerto, la caché y el registro
# ---------------------------------------------------------------------------------------------------
http_port 3128
cache_mem 64 MB
maximum_object_size_in_memory 4 MB
cache_dir ufs /var/spool/squid 200 16 256
maximum_object_size 50 MB
access_log daemon:/var/log/squid/access.log squid
coredump_dir /var/spool/squid
visible_hostname proxy.taquilla.test
pid_filename /run/squid.pid

# ---------------------------------------------------------------------------------------------------
# 👀 Quién es quién (ACL de origen)
# ---------------------------------------------------------------------------------------------------
acl oficina src 10.70.0.0/24          # toda la oficina
acl kiosko  src 10.70.0.30            # la pantalla del vestíbulo (sin usuario)

# ---------------------------------------------------------------------------------------------------
# ✍️ A1 · Sitios prohibidos para todos: reventa.test y apuestas.test (y sus subdominios)
# ---------------------------------------------------------------------------------------------------


# ---------------------------------------------------------------------------------------------------
# ✍️ A2 · Nada de vídeos (se comen la línea de la oficina): las URL que acaban en .mp4, .mkv o .avi
# ---------------------------------------------------------------------------------------------------


# ---------------------------------------------------------------------------------------------------
# ✍️ A3 · El personal entra con usuario y contraseña. El fichero de usuarios: /etc/squid/lab/usuarios
#         (lo creas con htpasswd en el proxy). El personal: marta (Taquilla-Marta-26) y jon (Taquilla-Jon-26)
# ---------------------------------------------------------------------------------------------------


# ---------------------------------------------------------------------------------------------------
# ✍️ A4 · El kiosko del vestíbulo: SOLO la cartelera (cartelera.test), sin usuario. Todo lo demás, prohibido (403)
# ---------------------------------------------------------------------------------------------------


# ---------------------------------------------------------------------------------------------------
# Las reglas, en orden. Ahora mismo deja salir a TODA la oficina sin preguntar nada.
# ---------------------------------------------------------------------------------------------------
http_access deny !oficina             # 👀 nadie de fuera de la oficina usa nuestro proxy
# ✍️ A1 a A4 · las tuyas, en el orden correcto (y quita la línea provisional)

http_access allow oficina             # ⚠️ provisional
http_access deny all                  # 👀 lo que no se ha permitido, prohibido
