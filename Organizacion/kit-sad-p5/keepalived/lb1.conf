# lb1.conf · Keepalived en el balanceador PRINCIPAL (lb1)
# Después de cada cambio:  ./lab.sh keepalived   (comprueba los dos ficheros y los aplica)

global_defs {
    router_id lb1
    script_user root
    enable_script_security
}

# ✍️ B2 · Un vrrp_script que compruebe cada segundo que HAProxy sigue vivo y, si no, baje la prioridad de lb1
#         lo bastante para que gane lb2


# 👀 La IP de la tienda (198.18.70.100) la tiene quien gane: el de más prioridad
vrrp_instance TIENDA {
    state MASTER
    interface internet
    virtual_router_id 70
    priority 200
    advert_int 4                       # ✍️ B3 · cada cuántos segundos dice «sigo vivo»
    unicast_src_ip 198.18.70.11
    unicast_peer {
        198.18.70.12
    }
    authentication {
        auth_type PASS
        auth_pass Taquil27
    }
    virtual_ipaddress {
        198.18.70.100/24
    }
    # ✍️ B2 · track_script { … }

}
