# haproxy.cfg · El balanceador de la tienda de entradas (el mismo fichero en lb1 y en lb2)
# Después de cada cambio:  ./lab.sh haproxy   (comprueba que no hay errores y lo aplica en los dos)

global
    stats socket /run/haproxy.sock mode 600 level admin
    maxconn 2000

defaults
    mode http
    timeout connect 3s
    timeout client  30s
    timeout server  30s

# 👀 La puerta de entrada: lo que llega al puerto 80 de este balanceador
frontend tienda
    bind :80
    # ✍️ A8 · Que los nodos sepan la IP real de quien compra

    default_backend venta

# Los nodos de venta
backend venta
    # ✍️ A6 · La cesta de la compra se guarda en la memoria de cada nodo: el mismo cliente tiene que ir SIEMPRE al
    #         mismo nodo (según su IP). Los TRES nodos, y comprobando que están vivos: GET /estado cada segundo
    server venta1 10.70.1.21:80

# ✍️ A7 · La página de estadísticas en el puerto 8404, en /estadisticas, con usuario admin y contraseña Taquilla-Stats

