# compose.yaml · la P4, Cita Fácil: Node, Vite, Sass, axe, Stylelint y Prettier viven aquí dentro.
# En tu ordenador no se instala nada.
#   docker compose run --rm web npm install                  ← la primera vez (descarga las herramientas)
#   docker compose up                                        ← la web:  http://localhost:5191
#   docker compose run --rm web npm run auditar              ← el test externo de accesibilidad (axe)
#   docker compose run --rm web npm run comprobar            ← el comprobador (A, B, C o D: npm run comprobar -- A)
#   docker compose run --rm web npm run lint                 ← Stylelint
#   docker compose run --rm web npm run formato:comprobar    ← Prettier (npm run formato lo arregla)
services:
  web:
    image: node:22-alpine     # imagen oficial de Node.js 22
    init: true                # para que Ctrl+C y «docker compose down» paren al momento
    working_dir: /app
    entrypoint: ["node", "docker/como-tu.mjs"]   # cada orden se ejecuta con TU usuario (el dueño de esta carpeta)
    environment:
      - TZ=Europe/Madrid
      - npm_config_update_notifier=false
    volumes:
      - .:/app                # la carpeta de la práctica, dentro del contenedor
    ports:
      - "127.0.0.1:5191:5191"   # http://localhost:5191 → la web del consultorio. Solo desde tu ordenador
    command: ["npm", "run", "dev"]
